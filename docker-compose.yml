# Override para integrar DataPusher+ (Prefect) al stack portal-andino-v2.
#
# NO modifica docker-compose.yml. Se usa en conjunto:
#   docker compose -f docker-compose.yml -f docker-compose.yml up -d --build
#
# Ver docs/andino-integration.md en el repo datapusher-plus para el paso a paso completo.

volumes:
  # ckan.ini generado en runtime por el contenedor ckan; el worker lo lee en :ro.
  ckan_ini:
  ckan_storage:
  pg_data:
  solr_data:
  pip_cache:
  site_packages:
  local_bin:
  home_dir:

services:

  # Extiende el servicio ckan existente:
  #   - Comparte /etc/ckan/default (donde vive ckan.ini) con el worker.
  #   - Inyecta la URL de la API de Prefect y el token de service account de DP+.
  nginx:
    build:
      context: nginx/
      dockerfile: Dockerfile
    networks:
      - webnet
      - ckannet
    depends_on:
      ckan:
        condition: service_healthy
    ports:
      - "0.0.0.0:${NGINX_SSLPORT_HOST}:${NGINX_SSLPORT}"
      - "0.0.0.0:${NGINX_PORT_HOST}:${NGINX_PORT}"

  ckan:
    build:
      context: ckan/
      dockerfile: Dockerfile
      args:
        - TZ=${TZ}
    env_file:
      - .env
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      # Generar con:
      #   docker compose ... exec ckan ckan -c /etc/ckan/default/ckan.ini \
      #       user token add ckan_admin datapusher_plus
      # Luego agregar CKANEXT__DATAPUSHER_PLUS__API_TOKEN=<token> al .env
      CKANEXT__DATAPUSHER_PLUS__API_TOKEN: ${CKANEXT__DATAPUSHER_PLUS__API_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
      solr:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ckan_storage:/var/lib/ckan
      - pip_cache:/root/.cache/pip
      - local_bin:/usr/local/bin
      - home_dir:/srv/app/
      - site_packages:/usr/lib/python3.10/site-packages
      #- ckan_ini:/etc/ckan/default

    networks:
      - ckannet
      - dbnet
      - solrnet
      - redisnet
      - prefectnet
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "-qO", "/dev/null", "http://localhost:5000/api/action/status_show" ]
      interval: 60s
      timeout: 10s
      retries: 3

  ckan-worker:
    build:
      context: ckan/
      dockerfile: Dockerfile
    user: root
    command: [ "/usr/bin/supervisord", "-n", "-c", "/etc/supervisor/supervisord.conf" ]
    env_file:
      - .env
    networks:
      - ckannet
      - dbnet
      - solrnet
      - redisnet
    volumes:
      - ckan_storage:/var/lib/ckan
      - pip_cache:/root/.cache/pip
      - local_bin:/usr/local/bin
      - home_dir:/srv/app/
      - site_packages:/usr/local/lib/python3.10/site-packages
      - ./ckan/cron_ckan:/var/spool/cron/crontabs/ckan
    depends_on:
      ckan:
        condition: service_healthy

  db:
    build:
      context: postgresql/
    networks:
      - dbnet
    env_file:
      - .env
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
      - CKAN_DB_USER
      - CKAN_DB_PASSWORD
      - CKAN_DB
      - DATASTORE_READONLY_USER
      - DATASTORE_READONLY_PASSWORD
      - DATASTORE_DB
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}" ]

  solr:
    networks:
      - solrnet
    build:
      context: ckan/solr/
      args:
        - SOLR_VERSION=${SOLR_IMAGE_VERSION}
    volumes:
      - solr_data:/var/solr
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "-qO", "/dev/null", "http://localhost:8983/solr/" ]

  redis:
    image: redis:${REDIS_VERSION}
    networks:
      - redisnet
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "-e", "QUIT" ]


  prefect-server:
    image: prefecthq/prefect:3-latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/prefect
      PREFECT_SERVER_API_HOST: 0.0.0.0
      # La URL que el navegador usa para llegar a la API; debe coincidir con el puerto expuesto.
      PREFECT_SERVER_UI_API_URL: ${PREFECT_HOST}:${PREFECT_PORT_HOST:-4200}/api
    command: prefect server start
    ports:
      - "${PREFECT_PORT_HOST:-4200}:4200"
    networks:
      - dbnet
      - prefectnet
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:4200/api/health', timeout=1)"]
      interval: 10s
      retries: 10
      start_period: 60s

  prefect-worker:
    build:
      # Ruta relativa al repo datapusher-plus desde portal-andino-v2.
      # Ajustar si el repo está en otra ubicación.
      context: ./datapusher-plus
      dockerfile: Dockerfile.worker
    env_file:
      - .env
    user: root
    depends_on:
      prefect-server:
        condition: service_healthy
      ckan:
        condition: service_healthy
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      CKAN_INI: /srv/app/ckan.ini
      PYTHONUNBUFFERED: 1
      CKAN_SQLALCHEMY_URL: postgresql://${CKAN_DB_USER}:${CKAN_DB_PASSWORD}@db:5432/${CKAN_DB}

    volumes:
      # ckan.ini compartido: el worker lo lee para saber la URL del datastore y el API token.
      #- ckan_ini:/etc/ckan/default/ckan.ini:ro
      # Código fuente montado editable; cambios en DP+ se toman con docker compose restart prefect-worker.
      - ckan_storage:/var/lib/ckan
      - pip_cache:/root/.cache/pip
      - local_bin:/usr/local/bin
      - home_dir:/srv/app/
      - site_packages:/usr/local/lib/python3.10/site-packages

    command: >
      bash -c "
        pip install -e /srv/app/src/datapusher-plus &&
        prefect worker start --pool datapusher-plus
      "
    networks:
      - ckannet
      - dbnet
      - prefectnet
      - solrnet
      - redisnet

    restart: on-failure


networks:
  # ckannet y dbnet ya están declaradas en docker-compose.yml; Compose las fusiona automáticamente.
  webnet:
  ckannet:
  solrnet:
    internal: true
  dbnet:
    internal: true
  redisnet:
    internal: true
  prefectnet:
